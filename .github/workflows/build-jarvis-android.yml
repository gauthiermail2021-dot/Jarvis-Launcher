# The default branch still contains an older Android snapshot.
# Do not compile/sign that snapshot as if it were the current Jarvis release.
# Use the named version workflow on a separately verified feature/fix branch.
name: "JARVIS — main historique, aucun APK"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outdated-base-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Informations sur la version active
        run: |
          echo "STOP : main contient encore Jarvis 1.2.31, pas la version actuelle."
          echo "Aucun APK n'est compile ou signe par ce workflow."
          echo "Depot officiel : https://github.com/gauthiermail2021-dot/Jarvis-Launcher"
          echo "Reference fonctionnelle : fix/layers-dismiss-after-ungroup-1.2.69"
          echo "Maintenance en test : fix/audit-stability-1.2.70"
          echo "Consulter README.md et docs/SOURCE_OF_TRUTH.md."
