name: Build Jarvis Bridge Android
on:
  # Déclenchement unique sur la branche d'essai, à la demande « Compile ».
  push:
    branches:
      - feature/android-jarvis-svg-loop-fix-v1.0.3
    paths:
      - 'android/**'
      - 'README.md'
      - '.github/workflows/build-jarvis-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 (runner preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Bridge-1.0.5-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK download as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis-Bridge-1.0.5-Test.apk
          if gh release view jarvis-1.0.5-preview >/dev/null 2>&1; then
            gh release upload jarvis-1.0.5-preview Jarvis-Bridge-1.0.5-Test.apk --clobber
          else
            gh release create jarvis-1.0.5-preview Jarvis-Bridge-1.0.5-Test.apk \
              --target "$GITHUB_SHA" \
              --title "Jarvis Bridge 1.0.5 - Diagnostic Gmail" \
              --notes "Prototype 1.0.5 : conserve les protections SVG, menu 1 s et grande bulle sans heure; ajoute diagnostic Google OAuth avec etat conserve, messages d'erreur exploitables au retour de selection du compte." \
              --prerelease
          fi
