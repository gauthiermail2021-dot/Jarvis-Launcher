name: Build Jarvis Bridge Android
on:
  # Les prochaines versions ne seront compilées qu'après feu vert explicite.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 (runner preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Bridge-1.0.3-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK download as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis-Bridge-1.0.3-Test.apk
          if gh release view jarvis-1.0.3-preview >/dev/null 2>&1; then
            gh release upload jarvis-1.0.3-preview Jarvis-Bridge-1.0.3-Test.apk --clobber
          else
            gh release create jarvis-1.0.3-preview Jarvis-Bridge-1.0.3-Test.apk \
              --target "$GITHUB_SHA" \
              --title "Jarvis Bridge 1.0.3 - Correction boucle SVG" \
              --notes "Prototype 1.0.3 : correction de boucle ACTION_VIEW quand Jarvis etait choisi comme application SVG par defaut. Ouverture externe uniquement, xTool prefere si disponible. Appui long 1 s et bulle conserves; grande bulle sans heure; statut Reception SVG et Ouverture xTool." \
              --prerelease
          fi
