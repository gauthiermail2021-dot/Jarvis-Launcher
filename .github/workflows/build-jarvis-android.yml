name: Build Jarvis Bridge Android
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-jarvis-android.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 (runner preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Bridge-0.9-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish direct APK download as GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Jarvis-Bridge-0.9-Test.apk
          if gh release view jarvis-0.9-preview >/dev/null 2>&1; then
            gh release upload jarvis-0.8.1-preview Jarvis-Bridge-0.8.1-Test.apk --clobber
          else
            gh release create jarvis-0.8.1-preview Jarvis-Bridge-0.8.1-Test.apk \
              --target "$GITHUB_SHA" \
              --title "Jarvis Bridge 0.9 - Conversation Jarvis" \
              --notes "Prototype 0.9 : lien de conversation configurable dans l'application; bulle flottante, double toucher et menu de 2 secondes conserves. Application distincte de Jarvis 0.7 et de 0.8.1. Le routage direct vers une conversation sur ChatGPT Android reste a tester." \
              --prerelease
          fi
