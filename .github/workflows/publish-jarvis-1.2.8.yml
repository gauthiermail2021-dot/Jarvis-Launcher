name: Publish already-built Jarvis 1.2.8 APK

on:
  push:
    branches:
      - fix/jarvis-autoopen-notification-label-1.2.8
    paths:
      - '.github/workflows/publish-jarvis-1.2.8.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successfully signed 1.2.8 artifact (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42552536481 --repo "$GITHUB_REPOSITORY" --name Jarvis-Bridge-1.2.8-signed --dir artifact
          test -s artifact/app-release.apk
          cp artifact/app-release.apk Jarvis-Bridge-1.2.8.apk

      - name: Publish 1.2.8 as separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view jarvis-1.2.8-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload jarvis-1.2.8-preview Jarvis-Bridge-1.2.8.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create jarvis-1.2.8-preview Jarvis-Bridge-1.2.8.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target 0e1fe505396a42fa6cf8649ecf7de78626044659 \
              --title "Jarvis Bridge 1.2.8 - correction Gmail auto-open" \
              --notes "Version test 1.2.8. L'ouverture automatique ne depend plus de la presence du texte Jarvis SVG dans la notification Gmail. APK signe avec la cle permanente. A verifier sur Android; la 1.2.7 reste disponible." \
              --prerelease
          fi
