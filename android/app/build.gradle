plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.jarvis.bridge'
    compileSdk 35

    defaultConfig {
        // Identité stable. Plus de suffixe preview pour les APK officiels.
        applicationId 'ca.jarvis.bridge'
        minSdk 26
        targetSdk 28
        versionCode 80
        versionName '1.2.61'
        // Jarvis 1.2.61 recovery: exact source of last user-confirmed SVG/XCS baseline 1.2.58.
        // Signed experimental release, must be verified on the Samsung.
    }

    signingConfigs {
        release {
            // La clé privée n'est jamais conservée dans ce dépôt public.
            // Elle est injectée uniquement pendant la compilation GitHub Actions.
            def signingFile = System.getenv('JARVIS_KEYSTORE_PATH')
            if (signingFile != null && !signingFile.isEmpty()) {
                storeFile file(signingFile)
                storePassword System.getenv('JARVIS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JARVIS_KEY_ALIAS')
                keyPassword System.getenv('JARVIS_KEY_PASSWORD')
            }
        }
    }

    lint {
        // APK distribue directement pour tests; niveau cible actuel conserve pour
        // compatibilite des notifications et de la bulle, sans publication Play Store.
        disable 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // Usage de développement local uniquement : NE PAS livrer comme version stable.
            applicationIdSuffix '.dev'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Aligner les variantes Kotlin utilisees transitivement par les bibliotheques Android.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // OCR numérique hors ligne, branché sur EasySetVisionAnalyzer en secours après ML Kit.
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    testImplementation 'junit:junit:4.13.2'
}
