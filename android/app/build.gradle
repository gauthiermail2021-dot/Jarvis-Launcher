plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.jarvis.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.jarvis.bridge'
        minSdk 26
        targetSdk 28
        versionCode 11
        versionName '1.0'
    }

    buildTypes {
        debug {
            // Installe le prototype 0.8 à côté de l'application stable 0.7.
            applicationIdSuffix '.preview10'
            // Clé debug générée automatiquement par Android Gradle Plugin.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Connexion Google OAuth pour Gmail
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
}
