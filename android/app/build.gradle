plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.jarvis.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.jarvis.bridge'
        minSdk 26
        targetSdk 28
        versionCode 16
        versionName '1.0.5'
    }

    buildTypes {
        debug {
            // Package de test 1.0.5 isole, car les APK de GitHub Actions utilisent une signature debug ephemere.
            applicationIdSuffix '.preview105'
            // Clé debug générée automatiquement par Android Gradle Plugin.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Connexion Google OAuth pour Gmail
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
}
