plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.jarvis.bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'ca.jarvis.bridge'
        minSdk 26
        targetSdk 28
        versionCode 13
        versionName '1.0.2'
    }

    buildTypes {
        debug {
            // Prototype 1.0.1 distinct afin de préserver les installations et paramètres précédents.
            applicationIdSuffix '.preview102'
            // Clé debug générée automatiquement par Android Gradle Plugin.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Connexion Google OAuth pour Gmail
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
}
